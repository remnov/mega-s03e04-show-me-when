name: Publish incident board
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/time.test.mjs
      - run: node --check app/app.js
      - name: Prepare the exact build
        run: |
          mkdir -p _site
          cp -R app/. _site/
          if [ -d evidence ]; then cp -R evidence _site/; fi
          BUILD_SHA="$(git log -1 --format=%H -- app)" node scripts/stamp-build.mjs _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
